<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Successful</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f2f5fa; }
    .card { width:420px; margin:40px auto; background:#fff; padding:24px 28px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
    h2 { color:#1e8449; margin-top:0; }
    a { color:#1d3c78; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="successMessage">Registration Successful!</h2>
    <p>Thank you, <strong id="regName">{{ entry.name }}</strong>.</p>
    <p>You are registered for <strong id="regEvent">{{ entry.event }}</strong>.</p>
    <p>A confirmation will be sent to <strong>{{ entry.email }}</strong>.</p>
    <p>Total registrations: {{ count }}</p>
    <a href="/register">Register another participant</a>
  </div>
</body>
</html>
