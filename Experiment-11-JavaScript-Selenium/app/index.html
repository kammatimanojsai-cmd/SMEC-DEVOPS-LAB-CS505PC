<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Increment Counter App</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 80px; background: #f2f5fa; }
    #counter { font-size: 64px; font-weight: bold; color: #1d3c78; display: block; margin: 20px; }
    button { font-size: 18px; padding: 10px 26px; margin: 6px; border: 0; border-radius: 4px; color: #fff; cursor: pointer; }
    #incrementButton { background: #1e8449; }
    #resetButton { background: #7f8c8d; }
  </style>
</head>
<body>
  <h1>Simple JavaScript Counter</h1>
  <span id="counter">0</span>
  <button id="incrementButton">Increment</button>
  <button id="resetButton">Reset</button>
  <script src="counter.js"></script>
</body>
</html>
