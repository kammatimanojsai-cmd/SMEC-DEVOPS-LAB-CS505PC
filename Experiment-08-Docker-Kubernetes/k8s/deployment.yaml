# Experiment 8 - Deployment for the Flask registration app (image built in Experiment 1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-registration
  labels:
    app: event-registration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-registration
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: event-registration
    spec:
      containers:
        - name: event-registration
          image: event-registration:1.0
          # Local image loaded into the cluster (minikube image load) - never pull from Docker Hub
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
